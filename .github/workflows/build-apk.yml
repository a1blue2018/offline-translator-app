name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 34
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Verify dictionary-data.js exists
        run: ls -lh app/src/main/assets/www/dictionary-data.js
      
      
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK Ordbok.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Ordbok.apk
          ls -lh dist/Ordbok.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ordbok.apk
          path: dist/Ordbok.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: Ordbok 1.1
          body: |
            Offline Norwegian ↔ English word dictionary for Android.

            Install **Ordbok.apk** on the phone (rename if it downloads as `.apk.zip`).
            Search `hei` — you should see `hi`. No internet needed.
          files: dist/Ordbok.apk
          fail_on_unmatched_files: true
