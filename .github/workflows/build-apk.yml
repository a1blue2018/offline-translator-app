name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Download dictionary sources
        run: |
          mkdir -p dict-src
          curl -L --fail -o dict-src/nb.jsonl.gz "https://kaikki.org/dictionary/Norwegian%20Bokm%C3%A5l/kaikki.org-dictionary-NorwegianBokm%C3%A5l.jsonl.gz"
          gunzip -f dict-src/nb.jsonl.gz
          curl -L --fail -o dict-src/no_50k.txt "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/no/no_50k.txt"
          curl -L --fail -o dict-src/en_50k.txt "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt"
          curl -L --fail -o dict-src/eng-nor.src.tar.xz "https://download.freedict.org/dictionaries/eng-nor/2025.11.23/freedict-eng-nor-2025.11.23.src.tar.xz"
          tar -xJf dict-src/eng-nor.src.tar.xz -C dict-src

      - name: Build offline word list
        run: python3 scripts/build-dictionary.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK Ordbok.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Ordbok.apk
          ls -lh dist/Ordbok.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ordbok.apk
          path: dist/Ordbok.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: Ordbok 1.1
          body: |
            Offline Norwegian ↔ English word dictionary for Android.

            Install **Ordbok.apk** on the phone (rename if it downloads as `.apk.zip`).
            Search `hei` — you should see `hi`. No internet needed.
          files: dist/Ordbok.apk
          fail_on_unmatched_files: true
